# tuxguitar-synth-vst3 settings for Windows
vst3.client.command=${tuxguitar.home.path}/vst3-client/tuxguitar-synth-vst3.exe,${vst3.sessionId},${vst3.serverPort},${vst3.bufferSize},${vst3.sampleRate},${vst3.path},${vst3.cid}
vst3.client.working.dir=${tuxguitar.home.path}/vst3-client
vst3.scan.command=${tuxguitar.home.path}/vst3-client/tuxguitar-synth-vst3.exe,--scan,${vst3.path}
# Additional folders to search for *.vst3 plugins, separated by ';'
vst3.plugin.paths=
